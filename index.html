<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Riya AI — AI Assistant</title>
<meta name="description" content="Riya AI — apna personal AI assistant. Chat karo, bolo, aur jawab suno. Exam Prep, notes PDF aur dost jaisa support — Hindi aur English me.">
<meta name="theme-color" content="#0a1628">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="orb" id="orb" aria-hidden="true"><span class="orb-core"></span></div>
      <div class="brand-text">
        <h1 id="appName">Riya AI</h1>
        <p id="statusLine">Online • Hindi + English</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="btn small hidden" type="button">Install App</button>
      <button id="shareBtn" class="btn small" type="button">Share</button>
      <button id="newChatBtn" class="btn small" type="button">New Chat</button>
      <button id="settingsBtn" class="btn small" type="button">Settings</button>
    </div>
  </header>

  <nav class="modes" id="modes" aria-label="Assistant mode">
    <button class="mode-btn active" data-mode="chat" type="button">Chat</button>
    <button class="mode-btn" data-mode="exam" type="button">Exam Prep</button>
    <button class="mode-btn" data-mode="dost" type="button">Dost Mode</button>
  </nav>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div class="chips" id="chips"></div>

  <footer class="composer">
    <button id="micBtn" class="mic-btn" type="button" title="Bol kar poochho" aria-label="Bol kar poochho">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <input id="input" type="text" placeholder="Kuch bhi poochho..." autocomplete="off" enterkeyhint="send">
    <button id="sendBtn" class="send-btn" type="button" title="Bhejo" aria-label="Bhejo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </footer>
</div>

<div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modal-card">
    <h2 id="settingsTitle">Settings</h2>

    <label class="field">
      <span>Model</span>
      <input id="modelInput" type="text" value="gemini-2.0-flash">
    </label>

    <label class="field">
      <span>Assistant ka naam</span>
      <input id="assistantNameInput" type="text" value="Riya">
    </label>

    <label class="field">
      <span>Bhasha / Language</span>
      <select id="langSelect">
        <option value="auto">Auto (jis bhasha me likho, usi me jawab)</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
      </select>
    </label>

    <label class="field check">
      <input id="voiceToggle" type="checkbox" checked>
      <span>Jawab bol kar sunao (voice reply)</span>
    </label>

    <div class="modal-actions">
      <button id="saveSettingsBtn" class="btn primary" type="button">Save</button>
      <button id="closeSettingsBtn" class="btn" type="button">Close</button>
    </div>
    <p class="hint">Koi key ya login nahi chahiye — bas app kholo aur use karo.</p>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="printArea" aria-hidden="true"></div>
<script src="app.js"></script>
</body>
</html>
